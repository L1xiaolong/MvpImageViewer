name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: v* release tag to create or update
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            echo "Expected a version such as v0.2.4 or v0.2.4-rc.1" >&2
            exit 1
          fi
          release_version="${BASH_REMATCH[1]}"
          project_version="$(sed -nE \
            's/^project\(ISPImageViewer VERSION ([0-9]+\.[0-9]+\.[0-9]+) LANGUAGES CXX\)$/\1/p' \
            CMakeLists.txt)"
          if [[ "$project_version" != "$release_version" ]]; then
            echo "Release tag $RELEASE_TAG does not match project version $project_version" >&2
            exit 1
          fi

          # A manual rerun for an existing tag must build the tagged commit,
          # never a different commit that happens to have the same version.
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
            checked_out_commit="$(git rev-parse HEAD)"
            if [[ "$tag_commit" != "$checked_out_commit" ]]; then
              echo "Existing tag $RELEASE_TAG points to $tag_commit, not $checked_out_commit" >&2
              echo "Run the workflow from the tag ref or publish a new version." >&2
              exit 1
            fi
          fi

      - name: Test runtime license collection
        run: python3 -m unittest discover -s tests -p test_runtime_licenses.py

  ci:
    name: CI gate
    needs: validate
    uses: ./.github/workflows/build.yml

  package:
    name: Package (${{ matrix.name }})
    needs:
      - validate
      - ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
            asset_suffix: macos-arm64
          - name: Windows x64
            os: windows-latest
            asset_suffix: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      # The event SHA is already the tag commit for a tag push, or the exact
      # branch commit selected in the workflow_dispatch UI.  Do not use the
      # requested release name as a checkout ref: manual releases are allowed
      # to create a new tag only after every package succeeds.
      - uses: actions/checkout@v7

      - uses: jurplel/install-qt-action@v4
        if: runner.os == 'macOS'
        with:
          version: '6.9.0'
          # Qt Quick Controls belongs to qtdeclarative; LinguistTools and
          # lrelease belong to qttools. These are archives rather than
          # install-qt add-on modules.
          modules: 'qtshadertools'
          archives: 'qtbase qtdeclarative qtsvg qttools'
          cache: true

      - name: Install image libraries (macOS)
        if: runner.os == 'macOS'
        run: brew install libraw exiv2 pkgconf

      - name: Set up MSYS2/UCRT64
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-qt6-shadertools
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-libraw
            mingw-w64-ucrt-x86_64-exiv2
            mingw-w64-ucrt-x86_64-python
            zip
            unzip

      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --no-progress --yes
          if ($LASTEXITCODE -ne 0) { throw "NSIS installation failed with exit code $LASTEXITCODE" }
          $nsisDirectory = @(
            (Join-Path ${env:ProgramFiles(x86)} "NSIS"),
            (Join-Path $env:ProgramFiles "NSIS")
          ) | Where-Object { Test-Path -LiteralPath (Join-Path $_ "makensis.exe") } |
            Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($nsisDirectory)) { throw "makensis.exe was not installed" }
          $nsisDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Package (macOS)
        if: runner.os == 'macOS'
        env:
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
          ISPVIEW_GITHUB_REPOSITORY: ${{ github.repository }}
          ISPVIEW_RUNTIME_CATALOG: ${{ vars.ISPVIEW_RUNTIME_CATALOG_MACOS }}
        run: |
          ./build_macos.sh package --no-zip
          project_version="$(sed -nE \
            's/^project\(ISPImageViewer VERSION ([0-9]+\.[0-9]+\.[0-9]+) LANGUAGES CXX\)$/\1/p' \
            CMakeLists.txt)"
          source_image="dist/MVPImageViewer-${project_version}-macos-arm64.dmg"
          installer="dist/MVPImageViewer-${RELEASE_TAG}-${ASSET_SUFFIX}.dmg"
          test -s "$source_image"
          mv "$source_image" "$installer"
          hdiutil verify "$installer"

      - name: Configure and build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          MSYS2_UCRT64: C:/msys64/ucrt64
        run: |
          cmake --preset windows-msys2-release \
            -DISPVIEW_BUILD_BENCHMARKS=OFF \
            -DISPVIEW_ENABLE_LCMS2=OFF \
            -DISPVIEW_GITHUB_REPOSITORY="${GITHUB_REPOSITORY}"
          cmake --build --preset windows-msys2-release --parallel

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
          ISPVIEW_RUNTIME_CATALOG: ${{ vars.ISPVIEW_RUNTIME_CATALOG_WINDOWS }}
        run: |
          set -euxo pipefail

          # Do not couple packaging to CMake's generator-specific target layout.
          # OUTPUT_NAME fixes the file name, while its directory may change with
          # Qt/CMake/MSYS2 updates.
          mapfile -d '' executable_candidates < <(
            find build/windows-msys2-release -type f \
              -iname 'MVPImageViewer.exe' -print0
          )
          if (( ${#executable_candidates[@]} != 1 )); then
            echo "Expected exactly one MVPImageViewer.exe, found ${#executable_candidates[@]}" >&2
            find build/windows-msys2-release -type f -iname '*.exe' -print >&2
            exit 1
          fi
          executable="${executable_candidates[0]}"
          echo "Packaging executable: $executable"
          package_directory='dist/MVPImageViewer'
          mkdir -p "$package_directory"
          cp "$executable" "$package_directory/MVPImageViewer.exe"
          cp "$(dirname "$executable")/ispview_crash_handler.exe" "$package_directory/"
          python scripts/archive_diagnostic_symbols.py --binary "$executable" --staged-binary "$package_directory/MVPImageViewer.exe" --output dist/symbols
          # MSYS2's windeployqt cannot launch its QML import scanner reliably.
          # Our QML module is compiled into the executable; deploy the required
          # Qt runtime and Qt-provided QML import trees explicitly.
          windeployqt6 --release --compiler-runtime --no-translations \
            --no-quick-import "$package_directory/MVPImageViewer.exe"
          mkdir -p "$package_directory/qml"
          qt_qml_directory="$(qtpaths6 --query QT_INSTALL_QML)"
          test -d "$qt_qml_directory" || {
            echo "Qt QML directory is missing: $qt_qml_directory" >&2
            exit 1
          }
          for qml_module in QtCore QtQml QtQuick; do
            source_module="$qt_qml_directory/$qml_module"
            test -f "$source_module/qmldir" || {
              echo "Required Qt QML module is missing: $source_module/qmldir" >&2
              exit 1
            }
            cp -a "$source_module" "$package_directory/qml/"
            test -f "$package_directory/qml/$qml_module/qmldir" || {
              echo "Failed to stage Qt QML module: $qml_module" >&2
              exit 1
            }
          done
          # Verify required runtime components without removing optional Qt
          # modules. A slightly larger archive is preferable to a package that
          # breaks after an MSYS2/Qt layout update.
          cmake \
            -DPACKAGE_ROOT="$package_directory" \
            -DPACKAGE_PLATFORM=windows \
            -DPACKAGE_PRUNE_OPTIONAL_COMPONENTS=OFF \
            -P scripts/prune_qt_runtime.cmake
          # windeployqt places platforms/, imageformats/, etc. beside the EXE.
          # Point Qt at that location instead of a non-existent plugins/ dir.
          printf '[Paths]\nPrefix = .\nPlugins = .\nQmlImports = qml\n' \
            > "$package_directory/qt.conf"

          # MSYS2 Qt links dynamically to GCC and distro libraries which
          # windeployqt --compiler-runtime does not deploy. Resolve the import
          # graph for the EXE, Qt plugins, and QML plugins recursively.
          ./scripts/deploy_msys2_runtime.sh "$package_directory"
          test -n "$(find "$package_directory" -maxdepth 1 -iname 'libexiv2*.dll' -print -quit)"
          test -n "$(find "$package_directory" -maxdepth 1 -iname 'libraw*.dll' -print -quit)"
          cmake "-DNOTICE_DESTINATION=$package_directory" -P scripts/package_licenses.cmake
          if ! python scripts/collect_runtime_licenses.py "$package_directory" \
            --msys-root "$(cygpath -m /)"; then
            echo "::warning::Runtime license audit is incomplete; packaging will continue."
          fi

      - name: Retain runtime license diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-license-audit-${{ matrix.asset_suffix }}
          path: |
            build/runtime-license-audit-macos/RUNTIME_DEPENDENCIES.*
            dist/MVPImageViewer/RUNTIME_DEPENDENCIES.*
          if-no-files-found: ignore

      - name: Create Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
        run: |
          $match = Select-String -LiteralPath "CMakeLists.txt" `
            -Pattern "project\(ISPImageViewer VERSION ([0-9]+\.[0-9]+\.[0-9]+)" | Select-Object -First 1
          if ($null -eq $match) { throw "Could not read the project version" }
          $version = $match.Matches[0].Groups[1].Value
          $installer = Join-Path $PWD "dist\MVPImageViewer-$($env:RELEASE_TAG)-$($env:ASSET_SUFFIX)-setup.exe"
          $stageDir = Join-Path $PWD "dist\MVPImageViewer"
          $icon = Join-Path $PWD "assets\icons\windows\ISPImageViewer.ico"
          & makensis.exe /V3 "/DSTAGE_DIR=$stageDir" "/DOUTPUT_FILE=$installer" `
            "/DAPP_VERSION=$version" "/DAPP_ICON=$icon" "packaging\windows\installer.nsi"
          if ($LASTEXITCODE -ne 0) { throw "NSIS failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath $installer)) { throw "Installer was not created" }

      - name: Archive diagnostic symbols
        uses: actions/upload-artifact@v7
        with:
          name: diagnostic-symbols-${{ matrix.asset_suffix }}-${{ github.sha }}
          path: dist/symbols/
          retention-days: 90
          if-no-files-found: error

      - name: Upload release asset
        uses: actions/upload-artifact@v7
        with:
          name: MVPImageViewer-${{ matrix.asset_suffix }}
          path: |
            dist/*.dmg
            dist/*-setup.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: MVPImageViewer-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          mac_installer="release-assets/MVPImageViewer-${RELEASE_TAG}-macos-arm64.dmg"
          windows_installer="release-assets/MVPImageViewer-${RELEASE_TAG}-windows-x64-setup.exe"
          test -s "$mac_installer"
          test -s "$windows_installer"

      - name: Create release and upload packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/*.dmg \
              release-assets/*-setup.exe \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/*.dmg \
              release-assets/*-setup.exe \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "MVP Image Viewer $RELEASE_TAG" \
              --generate-notes
          fi
