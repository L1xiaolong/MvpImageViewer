name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: v* release tag to create or update
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            echo "Expected a version such as v0.2.4 or v0.2.4-rc.1" >&2
            exit 1
          fi

  ci:
    name: CI gate
    needs: validate
    uses: ./.github/workflows/build.yml

  package:
    name: Package (${{ matrix.name }})
    needs:
      - validate
      - ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
            asset_suffix: macos-arm64
          - name: Windows x64
            os: windows-latest
            asset_suffix: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      # The event SHA is already the tag commit for a tag push, or the exact
      # branch commit selected in the workflow_dispatch UI.  Do not use the
      # requested release name as a checkout ref: manual releases are allowed
      # to create a new tag only after every package succeeds.
      - uses: actions/checkout@v7

      - uses: jurplel/install-qt-action@v4
        if: runner.os == 'macOS'
        with:
          version: '6.9.0'
          # Qt Quick Controls belongs to qtdeclarative; LinguistTools and
          # lrelease belong to qttools. These are archives rather than
          # install-qt add-on modules.
          modules: 'qtshadertools'
          archives: 'qtbase qtdeclarative qtsvg qttools'
          cache: true

      - name: Set up MSYS2/UCRT64
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-qt6-shadertools
            mingw-w64-ucrt-x86_64-qt6-tools
            zip

      - name: Configure and build (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake --preset macos-release -DISPVIEW_BUILD_BENCHMARKS=OFF
          cmake --build --preset macos-release --parallel

      - name: Package (macOS)
        if: runner.os == 'macOS'
        env:
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
        run: |
          ./build_macos.sh package --no-zip
          ditto -c -k --sequesterRsrc --keepParent dist/ISPImageViewer.app \
            "dist/ISPImageViewer-${RELEASE_TAG}-${ASSET_SUFFIX}.zip"

      - name: Configure and build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          MSYS2_UCRT64: C:/msys64/ucrt64
        run: |
          cmake --preset windows-msys2-release \
            -DISPVIEW_BUILD_BENCHMARKS=OFF \
            -DISPVIEW_ENABLE_LIBRAW=OFF \
            -DISPVIEW_ENABLE_EXIV2=OFF \
            -DISPVIEW_ENABLE_LCMS2=OFF
          cmake --build --preset windows-msys2-release --parallel

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
        run: |
          executable='dist/ISPImageViewer.exe'
          test -f "$executable"
          package_directory='dist/ISPImageViewer'
          mkdir -p "$package_directory"
          cp "$executable" "$package_directory/ISPImageViewer.exe"
          # MSYS2's windeployqt cannot launch its QML import scanner reliably.
          # Our QML module is compiled into the executable; deploy the required
          # Qt runtime and Qt-provided QML import trees explicitly.
          windeployqt6 --release --compiler-runtime --no-translations \
            --no-quick-import "$package_directory/ISPImageViewer.exe"
          mkdir -p "$package_directory/qml"
          qt_qml_directory='/ucrt64/share/qt6/qml'
          for qml_module in QtCore QtQml QtQuick; do
            source_module="$qt_qml_directory/$qml_module"
            test -f "$source_module/qmldir"
            cp -a "$source_module" "$package_directory/qml/"
            test -f "$package_directory/qml/$qml_module/qmldir"
          done
          cmake \
            -DPACKAGE_ROOT="$package_directory" \
            -DPACKAGE_PLATFORM=windows \
            -P scripts/prune_qt_runtime.cmake
          # windeployqt places platforms/, imageformats/, etc. beside the EXE.
          # Point Qt at that location instead of a non-existent plugins/ dir.
          printf '[Paths]\nPrefix = .\nPlugins = .\nQmlImports = qml\n' \
            > "$package_directory/qt.conf"

          # MSYS2 Qt links dynamically to GCC and distro libraries which
          # windeployqt --compiler-runtime does not deploy. Resolve the import
          # graph for the EXE, Qt plugins, and QML plugins recursively.
          ./scripts/deploy_msys2_runtime.sh "$package_directory"

          # A successful build is not enough: launch the exact packaged app and
          # require it to load QML, render a frame, and save a screenshot.
          smoke_screenshot="$package_directory/startup-smoke.png"
          smoke_screenshot_windows="$(cygpath -w "$smoke_screenshot")"
          isolated_path="$package_directory:/c/Windows/System32:/c/Windows"
          PATH="$isolated_path" \
            QT_PLUGIN_PATH= \
            QT_QPA_PLATFORM_PLUGIN_PATH= \
            QML_IMPORT_PATH= \
            QML2_IMPORT_PATH= \
            QT_FORCE_STDERR_LOGGING=1 \
            /usr/bin/timeout 30s \
            "$package_directory/ISPImageViewer.exe" \
            --screenshot "$smoke_screenshot_windows" \
            --screenshot-delay 1500
          test -s "$smoke_screenshot"
          rm -f "$smoke_screenshot"
          (
            cd dist
            zip -r "ISPImageViewer-${RELEASE_TAG}-${ASSET_SUFFIX}.zip" ISPImageViewer
          )

      - name: Upload release asset
        uses: actions/upload-artifact@v7
        with:
          name: ISPImageViewer-${{ matrix.asset_suffix }}
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release and upload packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/*.zip \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/*.zip \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "ISP Image Viewer $RELEASE_TAG" \
              --generate-notes
          fi
